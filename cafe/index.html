<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe OCC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- へったー-->
    <header>
        <h1>Cafe OCC</h1>
        <!-- menuを書くときは<ul>と<li>を使うといいよ -->
             <nav> 
                <!-- a href="#**"は、同じページ内の特定の場所にジャンプするためのリンクです。例えば、a href="#about"は、ページ内のid="about"が付けられた要素にジャンプします。
                 --> 
                <!-- a href="http://は別のページにジャンプするためのリンクです。例えば、a href="https://www.example.com"は、ユーザーをhttps://www.example.comにジャンプさせます。
                 -->
                <a href="#about">about</a>
                <a href="#menu">menu</a>
                <a href="#access">access</a>
            </nav>
            <button>テーマ変更</button>
    </header>

    <!-- メイン -->
    <main>
     <section id="hero">
        <h2>朝の光と、一杯コーヒー。</h2>
        <p>静かな時間をお届けする街のカフェ</p>
     </section>

     <section id="about">
        <h2>About</h2>
        <p>Cafe OCCは、静かな空間でコーヒーを楽しむための場所です。心を落ち着かせる音楽と、豊かな香りに包まれ、一日の始まりを心ゆくまでお楽しみください。</p>
        <p>お一人でも、ご家族でも、お気軽にどうぞ❣</p>
        <p>営業時間:8:00 - 20:00<br>
           定休日:水曜日</p>
     </section>

    </main>

    <!-- フッター -->
    <footer>

    </footer>
</body>
</html>
